name: CI/CD (Learning)

# (Deploy requires a CLOUDFLARE_API_TOKEN with Workers Scripts, D1, Workers R2 Storage, Workers Routes and Zone Read - see DEPLOYMENT.md.)
# apps/learning -> Cloudflare Worker `iqraspace-learning` (route
# iqraspace.org/learning*). `validate` runs on every PR / push to main that
# touches this app; `deploy` runs only for a push to main AND only when the
# repository variable CF_DEPLOY_ENABLED == 'true' (so merging before the
# Cloudflare token exists cannot break CI). See DEPLOYMENT.md.
#
# Database migrations (apps/learning/d1/migrations) are never applied by CI —
# run `npx wrangler d1 migrations apply iqraspace-learning --remote` manually
# BEFORE merging a change that needs them (see apps/learning/BACKEND.md).

on:
  push:
    branches: [main]
    paths:
      - "apps/learning/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/cf-preflight.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/learning/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: learning-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/learning

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/learning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc needs next-env.d.ts and .next/types/**, normally only generated
      # by dev/build (gitignored) — `next typegen` generates just those.
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npm run typecheck

      - name: Run tests (if any)
        run: npm run test --if-present

      - name: Run Duas unit tests (if present)
        run: npm run test:duas --if-present

      # Routing + the Learning API (query compiler, access policies, auth,
      # RPCs, Duas feed) against real SQLite with the D1 migrations applied.
      - name: Run Worker + API tests
        run: npm run test:worker

      - name: Build for Cloudflare
        run: npm run build:cf

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: learning-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/learning/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cf

      - name: Cloudflare credential preflight
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cf-preflight.sh

      - name: Deploy (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            # surface wrangler's own error as an annotation (readable without log access)
            msg=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/deploy.log" | tail -12 | paste -sd'|' - | cut -c1-1500)
            echo "::error title=wrangler deploy failed (exit $rc)::$msg"
          fi
          exit $rc

      # Base URL is the repo variable CF_HEALTHCHECK_BASE (default
      # https://iqraspace.org). Before DNS cutover that still hits the old
      # host, so during staging point it at the workers.dev URL — note the
      # worker only serves /learning/* paths on any host.
      - name: Health check
        env:
          BASE: ${{ vars.CF_HEALTHCHECK_BASE || 'https://iqraspace.org' }}
        run: |
          set -u
          fail=0
          for path in /learning/login /learning/share/00000000-0000-0000-0000-000000000000 /learning/api/duas/version; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE$path" || echo 000)
              echo "$path -> HTTP $code (attempt $attempt)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Health check failed for $BASE$path"
              fail=1
            fi
          done
          exit $fail

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary (Learning)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Run | #${{ github.run_number }} |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Timestamp (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo "| Public URL | https://iqraspace.org/learning |"
          } >> "$GITHUB_STEP_SUMMARY"
