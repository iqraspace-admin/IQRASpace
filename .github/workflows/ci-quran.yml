name: CI/CD (Quran)

# (Deploy requires a CLOUDFLARE_API_TOKEN with Workers Scripts, D1, Workers Routes and Zone Read - see DEPLOYMENT.md.)
# apps/quran -> Cloudflare Worker `iqraspace-quran` (route
# iqraspace.org/quran*). Path-filtered; fully independent of the other apps'
# pipelines. `deploy` runs only for a push to main AND only when the
# repository variable CF_DEPLOY_ENABLED == 'true'. See DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/quran/**"
      - ".github/workflows/ci-quran.yml"
      - ".github/scripts/cf-preflight.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/quran/**"
      - ".github/workflows/ci-quran.yml"
  workflow_dispatch:

concurrency:
  group: quran-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/quran

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/quran/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npm run typecheck

      - name: Run tests (if any)
        run: npm run test --if-present

      # Needs no Quran Foundation credentials: synced content under
      # src/content/generated is committed, not fetched at build time.
      - name: Build for Cloudflare
        run: npm run build:cf

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: quran-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/quran/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cf

      - name: Cloudflare credential preflight
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cf-preflight.sh

      - name: Deploy (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            # surface wrangler's own error as an annotation (readable without log access)
            msg=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/deploy.log" | tail -12 | paste -sd'|' - | cut -c1-1500)
            echo "::error title=wrangler deploy failed (exit $rc)::$msg"
          fi
          exit $rc

      # Base URL is the repo variable CF_HEALTHCHECK_BASE (default
      # https://iqraspace.org). Before DNS cutover point it at the
      # workers.dev URL for staging.
      - name: Health check
        env:
          BASE: ${{ vars.CF_HEALTHCHECK_BASE || 'https://iqraspace.org' }}
        run: |
          set -u
          fail=0
          for path in /quran /quran/surah /quran/sitemap.xml; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE$path" || echo 000)
              echo "$path -> HTTP $code (attempt $attempt)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Health check failed for $BASE$path"
              fail=1
            fi
          done
          exit $fail

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary (Quran)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Run | #${{ github.run_number }} |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Timestamp (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo "| Public URL | https://iqraspace.org/quran |"
          } >> "$GITHUB_STEP_SUMMARY"
