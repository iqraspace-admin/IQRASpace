name: CI (Quran Mobile / Android)

# Separate from ci-quran.yml (the web/Vercel pipeline) — this one only
# proves the Android shell actually builds, on the one thing this repo's
# other CI lanes never touch: a real Gradle/Android SDK toolchain. Lives
# only on mobile/android (see apps/quran/MOBILE.md §0's branch strategy)
# so it never runs against main, and main's ci-quran.yml never gains an
# Android dependency.
#
# Debug build only, no signing: producing a *signed release* needs a
# real upload keystore under the app owner's control (MOBILE.md §6/§7) —
# not something a CI secret should hold until that's deliberately set
# up. This workflow's job is "did the native project just break",
# answered with an installable-for-testing debug APK, not a store
# artifact.

on:
  push:
    branches: [mobile/android]
    paths:
      - "apps/quran/**"
      - ".github/workflows/ci-quran-mobile.yml"
  pull_request:
    branches: [mobile/android]
    paths:
      - "apps/quran/**"
      - ".github/workflows/ci-quran-mobile.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/quran

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: apps/quran/package-lock.json

      # GitHub-hosted ubuntu-latest runners ship a preinstalled Android
      # SDK (cmdline-tools + common platform/build-tools versions) —
      # see actions/runner-images. No android-actions/setup-android step
      # needed unless a future AGP bump needs a platform this image
      # doesn't already have, in which case add it here.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Static export (out/) + copy into android/app/src/main/assets/public
      # — the same command MOBILE.md's local workflow documents.
      - name: Build static export & sync into Capacitor
        run: npm run cap:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: apps/quran/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iqraspace-quran-debug-apk
          path: apps/quran/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Android Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Run | #${{ github.run_number }} (run id ${{ github.run_id }}) |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Timestamp (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo ""
            echo "Debug APK (unsigned, install via \`adb install\` for testing only) attached as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
