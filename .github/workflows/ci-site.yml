name: CI/CD (Site)

# (Deploy requires a CLOUDFLARE_API_TOKEN with Workers Scripts, D1, Workers Routes and Zone Read - see DEPLOYMENT.md.)
# apps/site -> Cloudflare Worker `iqraspace-site` (routes iqraspace.org/* and
# www): static pages via Static Assets plus a Worker script for the /contact
# form (D1 binding DB; secrets are set on the Worker, never in CI).
# Path-filtered; `deploy` runs only for a push to main AND only when the
# repository variable CF_DEPLOY_ENABLED == 'true'. See DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/ci-site.yml"
      - ".github/scripts/cf-preflight.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/ci-site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/site

jobs:
  validate:
    name: Validate HTML, config & Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Validate package.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Install dependencies
        run: npm install

      - name: Run tests (if any)
        run: npm run test --if-present

      - name: Run Worker tests (if present)
        run: |
          if ls worker/*.test.mjs >/dev/null 2>&1; then
            node --test worker/*.test.mjs
          else
            echo "No worker tests found - skipping"
          fi

      - name: Validate index.html
        run: npx --yes html-validate index.html

      - name: Build for Cloudflare
        run: npm run build:cf

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Build for Cloudflare
        run: npm run build:cf

      - name: Cloudflare credential preflight
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_NEEDS_D1: "true"
        run: bash .github/scripts/cf-preflight.sh

      - name: Deploy (wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: deploy

      # Base URL is the repo variable CF_HEALTHCHECK_BASE (default
      # https://iqraspace.org). Before DNS cutover point it at the
      # workers.dev URL for staging.
      - name: Health check
        env:
          BASE: ${{ vars.CF_HEALTHCHECK_BASE || 'https://iqraspace.org' }}
        run: |
          set -u
          fail=0
          for path in / /robots.txt /sitemap.xml; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE$path" || echo 000)
              echo "$path -> HTTP $code (attempt $attempt)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Health check failed for $BASE$path"
              fail=1
            fi
          done
          exit $fail

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary (Site)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Run | #${{ github.run_number }} |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Timestamp (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo "| Public URL | https://iqraspace.org |"
          } >> "$GITHUB_STEP_SUMMARY"
