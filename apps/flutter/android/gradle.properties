org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Required on this machine: the project lives on F:\ while the Gradle/Kotlin
# caches and the pub cache (plugin sources like url_launcher_android) live on
# C:\. Kotlin's incremental compiler tries to relativize plugin source paths
# against the project root and throws "this and base files have different
# roots" across drive letters on Windows, failing compileDebugKotlin/
# compileReleaseKotlin. Disabling incremental compilation avoids that path
# call entirely; it only makes Kotlin recompilation slower, not the output.
kotlin.incremental=false
